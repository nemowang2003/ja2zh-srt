[project]
name = "ja2zh-srt"
version = "0.2.2"
description = "Japanese audio to Japanese and Chinese SRT using audio-transcribe and an LLM API."
readme = "README.md"
authors = [
    { name = "nemowang", email = "nemowang@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,<9",
    "audio-transcribe",
    "httpx>=0.28,<1",
    "openai>=2,<3",
    "srt>=3.5.3",
]

[project.scripts]
ja2zh-srt = "ja2zh_srt:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[dependency-groups]
build = [
    "uv_build>=0.13.5,<0.14",
]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.uv.sources]
audio-transcribe = { git = "https://github.com/nemowang2003/audio-transcribe" }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]
