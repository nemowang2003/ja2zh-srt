[project]
name = "ja2zh-srt"
version = "0.1.0"
description = "CUDA-only Japanese MP3 to Japanese and Chinese SRT pipeline using faster-whisper and Sakura LLM."
readme = "README.md"
authors = [
    { name = "nemowang", email = "nemowang@outlook.com" }
]
requires-python = ">=3.12, <3.13"
dependencies = [
    "click>=8.4.1",
    "faster-whisper>=1.2.1",
    "huggingface-hub>=1.16.1",
    "humanize>=4.15.0",
    "openai>=2.41.0",
    "platformdirs>=4.10.0",
    "srt>=3.5.3",
]

[project.scripts]
ja2zh-srt = "ja2zh_srt:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]
