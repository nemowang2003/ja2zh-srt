[workspace]
name = "ja2zh-srt"
channels = ["conda-forge"]
platforms = ["linux-64"]

[system-requirements]
cuda = "12.9"

[dependencies]
python = "3.12.*"
uv = "*"
ffmpeg = "*"
cuda-version = "12.9.*"
libcublas = "12.*"
cudnn = "9.*"

[dependencies."llama.cpp"]
version = "*"
build = "cuda*"

[tasks]
sync = "uv sync"
check = "uv run ja2zh-srt check"
check-tools = "ffmpeg -version && llama-server --version"
