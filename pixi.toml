[workspace]
name = "ja2zh-srt"
channels = ["conda-forge"]
platforms = ["linux-64"]

[system-requirements]
cuda = "12"

[dependencies]
python = "3.12.*"
uv = "*"
ffmpeg = "*"
cuda-version = "12.*"

[dependencies."llama.cpp"]
version = "*"
build = "cuda*"

[tasks]
sync = "uv sync"
check = "uv run ja2zh-srt check"
check-tools = "ffmpeg -version && llama-server --version"
